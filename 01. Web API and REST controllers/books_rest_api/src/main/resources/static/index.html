<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Books</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="search-wrapper">
    <div class="search-container">
        <input type="text"
               id="searchInput"
               placeholder="Search by title"/>
        <button id="searchButton" class="search-btn">Search</button>
    </div>
</div>


<!-- Authors -->
<div class="table-container">
    <table id="booksTable">
        <thead>
        <tr>
            <th>Book Title</th>
            <th>Author Name</th>
            <th>Release Date</th>
            <th>Copies</th>
            <th>Publisher</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td>Book 1 Title</td>
            <td>Author 1</td>
            <td>2024-01-15</td>
            <td>100</td>
            <td>Publisher A</td>
        </tr>
        <tr>
            <td>Book 2 Title</td>
            <td>Author 2</td>
            <td>2023-05-20</td>
            <td>50</td>
            <td>Publisher B</td>
        </tr>
        </tbody>
    </table>
</div>

<br/>
<br/>

<!-- Books -->
<div class="form-container">
    <form
            action="#"
            method="post">
        <h2>Add Book</h2>
        <div class="form-group">
            <label for="title">Title:</label>
            <input
                    type="text"
                    id="title"
                    name="title" required>
        </div>
        <div class="form-group">
            <label for="author">Author Name:</label>
            <input
                    type="text"
                    id="author"
                    name="author" required>
        </div>
        <div class="form-group">
            <label for="releaseDate">Release Date:</label>
            <input
                    type="date"
                    id="releaseDate"
                    name="releaseDate" required>
        </div>
        <div class="form-group">
            <label for="copies">Copies:</label>
            <input
                    type="number"
                    id="copies"
                    name="copies" min="1" required>
        </div>
        <div class="form-group">
            <label for="publisher">Publisher:</label>
            <input
                    type="text"
                    id="publisher"
                    name="publisher" required>
        </div>
        <button type="submit">Create Book</button>
    </form>
</div>

<script src="app.js" type="text/javascript"></script>

</body>
</html>
